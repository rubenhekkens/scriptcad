[project]
name = "scriptcad"
version = "0.1.0"
description = "Browser-based parametric and scripted CAD on NVIDIA's USD BRep (SMLib) kernel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/scriptcad/web/vendor/*/LICENSE"]
# usd-brep only ships CPython 3.12 wheels (Windows x86_64, Linux x86_64/aarch64)
requires-python = "==3.12.*"
dependencies = [
    "usd-brep==1.0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "platformdirs>=4",
]
keywords = ["cad", "brep", "openusd", "nurbs", "solid-modeling"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
# OpenCASCADE, for STEP import/export (LGPL-2.1, used unmodified as a separate wheel)
step = ["cadquery-ocp>=7.8,<9"]

[project.scripts]
scriptcad = "scriptcad.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
