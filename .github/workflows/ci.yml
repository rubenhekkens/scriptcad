name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra step
      - run: uv run pytest -v
        env:
          # also downloads the pinned STEP converters and runs the round-trip tests
          SCRIPTCAD_TEST_STEP_TOOLS: "1"
      - name: Build wheel
        run: uv build
